<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal de Asistencia - Cámara y Pistola QR</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .scanner-card {
      background: #1e293b;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: #94a3b8; font-size: 13px; margin: 0 0 18px; }

    .badges-wrapper {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge-pistola { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid #3b82f6; }
    .badge-camara { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }

    .dot { width: 6px; height: 6px; background: currentColor; border-radius: 50%; }

    #reader-container {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      margin-bottom: 16px;
      position: relative;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #reader { width: 100% !important; border: none !important; }

    #success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    .hidden { display: none !important; }

    .icon-check {
      width: 58px; height: 58px;
      border-radius: 50%;
      background: #22c55e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 12px;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }

    .btn-action {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
    }
    .btn-action:hover { background: #1d4ed8; }

    .btn-cam {
      background: #334155;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .btn-cam:hover { background: #475569; }

    .result-card {
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result-waiting { background: #334155; color: #cbd5e1; }
    .result-success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .result-error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
  </style>
</head>
<body>

  <div class="scanner-card">
    <h1>Terminal de Asistencia</h1>
    <p>Escanea con cámara web o pistola física</p>

    <div class="badges-wrapper">
      <span class="badge badge-pistola"><span class="dot"></span> Pistola lista</span>
      <span class="badge badge-camara" id="badge-cam-status"><span class="dot"></span> Cámara inactiva</span>
    </div>

    <div id="reader-container">
      <div id="reader"></div>

      <div id="success-overlay" class="hidden">
        <div class="icon-check">✓</div>
        <h3 id="overlay-dni" style="margin: 0 0 6px; font-size: 18px; color: #f8fafc;">Asistencia Registrada</h3>
        <p id="overlay-time" style="margin: 0; font-size: 14px; color: #94a3b8;">Hora: --:--:--</p>
        <div id="overlay-timer" style="margin-top: 10px; font-size: 13px; color: #38bdf8;">Siguiente en 4s...</div>
        <button class="btn-action" onclick="reanudarEscaneo()">Escanear Siguiente</button>
      </div>
    </div>

    <button id="btn-toggle-cam" class="btn-cam" onclick="toggleCamara()">Encender Cámara</button>

    <div id="resultado" class="result-card result-waiting">
      Esperando escaneo...
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxw4SCqgPWhdOoretORgpEDtQOACBAlathlotgaklaMAPfUSgNnIpq24FUMi2J8dpsN/exec";

    let html5QrCode = null;
    let camaraActiva = false;
    let procesando = false;
    let cooldownTimer = null;

    let ultimoDniRegistrado = "";
    let tiempoUltimoRegistro = 0;
    const BLOQUEO_DNI_MS = 60000; // 60s mínimo para el mismo DNI en este navegador

    const resultado = document.getElementById("resultado");
    const badgeCam = document.getElementById("badge-cam-status");
    const btnCam = document.getElementById("btn-toggle-cam");
    const overlay = document.getElementById("success-overlay");
    const overlayDni = document.getElementById("overlay-dni");
    const overlayTime = document.getElementById("overlay-time");
    const overlayTimerText = document.getElementById("overlay-timer");

    // Audio seguro con instancia única
    let audioCtx = null;
    function reproducirBeep(freq, durMs) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (durMs / 1000));
        osc.start();
        osc.stop(audioCtx.currentTime + (durMs / 1000));
      } catch (e) {}
    }

    // 1. PISTOLA FÍSICA
    let bufferPistola = "";
    let ultimoKeyTime = 0;

    document.addEventListener("keydown", (e) => {
      const now = Date.now();
      if (e.key === "Enter") {
        if (bufferPistola.length > 5) {
          procesarAsistencia(bufferPistola.trim(), "Pistola");
        }
        bufferPistola = "";
        return;
      }
      if (e.key.length === 1) {
        if (now - ultimoKeyTime > 120) bufferPistola = "";
        bufferPistola += e.key;
        ultimoKeyTime = now;
      }
    });

    // 2. CÁMARA
    async function toggleCamara() {
      if (camaraActiva) await detenerCamara();
      else await iniciarCamara();
    }

    async function iniciarCamara() {
      html5QrCode = new Html5Qrcode("reader");
      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 230, height: 230 } },
          (decodedText) => procesarAsistencia(decodedText, "Cámara")
        );
        camaraActiva = true;
        btnCam.innerText = "Apagar Cámara";
        badgeCam.innerText = "● Cámara activa";
        badgeCam.style.color = "#4ade80";
      } catch (err) {
        resultado.className = "result-card result-error";
        resultado.innerText = "Sin acceso a cámara.";
      }
    }

    async function detenerCamara() {
      if (html5QrCode && camaraActiva) {
        await html5QrCode.stop();
        html5QrCode.clear();
        camaraActiva = false;
        btnCam.innerText = "Encender Cámara";
        badgeCam.innerText = "● Cámara inactiva";
        badgeCam.style.color = "#94a3b8";
      }
    }

    // 3. ENVÍO Y PROCESAMIENTO
    async function procesarAsistencia(codigoQR, origen) {
      if (procesando) return;

      const partes = codigoQR.split("|");
      const dni = partes[0] || "";
      const ahora = Date.now();

      // Bloqueo rápido de DNI idéntico en este terminal
      if (dni === ultimoDniRegistrado && (ahora - tiempoUltimoRegistro < BLOQUEO_DNI_MS)) {
        resultado.className = "result-card result-error";
        resultado.innerText = `⚠️ DNI ${dni} ya marcó asistencia hace un momento.`;
        reproducirBeep(300, 200);
        return;
      }

      procesando = true;

      // PAUSAR CÁMARA INMEDIATAMENTE PARA EVITAR DETECCIONES EN BUCLE
      if (html5QrCode && camaraActiva) {
        try { html5QrCode.pause(true); } catch(e) {}
      }

      resultado.className = "result-card result-waiting";
      resultado.innerText = `Validando (${origen})...`;

      try {
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "marcarAsistencia",
            code: codigoQR,
            local_id: "Sede Principal"
          })
        });

        const data = await resp.json();

        if (data.status === "success") {
          ultimoDniRegistrado = dni;
          tiempoUltimoRegistro = ahora;

          resultado.className = "result-card result-success";
          resultado.innerText = `✅ Acceso: ${data.message} (${data.hora})`;
          reproducirBeep(850, 150);

          mostrarExito(dni, data.hora);
        } else {
          resultado.className = "result-card result-error";
          resultado.innerText = `❌ ${data.message || "QR inválido o expirado"}`;
          reproducirBeep(300, 300);

          // Si falló, reanudar cámara tras 2 segundos
          setTimeout(() => {
            if (html5QrCode && camaraActiva) {
              try { html5QrCode.resume(); } catch(e) {}
            }
            procesando = false;
            resultado.className = "result-card result-waiting";
            resultado.innerText = "Esperando escaneo...";
          }, 2000);
        }

      } catch (err) {
        resultado.className = "result-card result-error";
        resultado.innerText = "Error de conexión con Google Sheets";
        setTimeout(() => {
          if (html5QrCode && camaraActiva) {
            try { html5QrCode.resume(); } catch(e) {}
          }
          procesando = false;
        }, 2000);
      }
    }

    function mostrarExito(dni, hora) {
      overlayDni.innerText = `DNI: ${dni}`;
      overlayTime.innerText = `Hora: ${hora}`;
      overlay.classList.remove("hidden");

      let cuenta = 4;
      overlayTimerText.innerText = `Siguiente en ${cuenta}s...`;

      clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        cuenta--;
        if (cuenta > 0) {
          overlayTimerText.innerText = `Siguiente en ${cuenta}s...`;
        } else {
          reanudarEscaneo();
        }
      }, 1000);
    }

    function reanudarEscaneo() {
      clearInterval(cooldownTimer);
      overlay.classList.add("hidden");
      resultado.className = "result-card result-waiting";
      resultado.innerText = "Esperando escaneo...";

      // Reanudar cámara
      if (html5QrCode && camaraActiva) {
        try { html5QrCode.resume(); } catch(e) {}
      }

      procesando = false;
    }

    window.addEventListener("DOMContentLoaded", () => {
      iniciarCamara();
    });
  </script>
</body>
</html>
